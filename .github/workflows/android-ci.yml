name: Android CI

# Hermes Android CI Workflow
# This workflow runs on every push and pull request

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    # Set timeout for the job
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 34
          build-tools-version: 34.0.0
          ndk-version: 26.2.11394342
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace --no-daemon
        working-directory: .
        continue-on-error: false
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 30
      
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        working-directory: .
        continue-on-error: false
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
      
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        working-directory: .
        continue-on-error: false
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        working-directory: .
        continue-on-error: false
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      
      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-android-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
